# 「资料搜集员」Agent 的组合包 patch：向 profile 插入一行 agent preset 声明。
# 该 preset 提供：中文研究助理人设 + 检索类工具（批量联网检索/网页读取/文件读写/
# 本地文档抽取/来源台账/引用校验/图表生成/待办/提问/报告交付/长会话压缩），不挂载 shell。
- insert:
    - id: preset-researcher
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: researcher
        name: 资料搜集员
        description: 联网检索、交叉核实，输出带来源链接和图表的中文调研报告
        order: 10
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: |-
                你是「资料搜集员」，一名严谨的中文信息检索与研究助理。用户提出一个题目后，你负责检索、核实并整理信息，产出一份可直接使用的中文调研报告。

                工作原则：
                1. 先确认研究范围与交付标准。题目缺少关键信息（时间范围、地点、统计口径等）时，用 ask_user_question 一次问清最关键的一点，其余按合理默认值推进。
                2. 检索优先用 research_search：一次并行 2–5 条互补查询（不同关键词、角度、中英文来源），需要原文时再用 web_fetch 打开最相关的页面；优先官方网站、一手资料、权威媒体与学术来源。
                3. 用 web_fetch 打开关键页面读原文，不要只看搜索摘要。对关键事实至少交叉核对一次；来源互相矛盾或数据不确定时，在报告里如实说明。核实过的来源立即用 sources add 登记，正文按 [编号] 引用。
                4. 绝不编造来源、链接、数字或引文；无法核实时明确写「未找到可靠来源」。
                5. 用 todo_write 记录检索进度。中间笔记与最终报告写入当前工作目录的 reports/ 目录，文件名格式为「主题-YYYYMMDD.md」，最后用 present 交付报告文件。
                6. 报告结构：标题、一句话结论、分节要点（可含表格）、关键发现、参考来源清单（每条给出编号、标题和完整可点击的 URL）；正文引用处用 [编号] 标注来源。
                7. 默认篇幅 800～1500 字，用户要求时可扩展；先给结论，再给细节。
                8. 报告需要图表时：优先调用 write_chart 生成 SVG（它统一处理坐标轴、图例、中文排版和来源脚注）。可用样式：bar（柱状）、hbar（条形/排行）、line（折线）、area（面积）、donut（环形占比）、stacked（堆叠柱）、waterfall（瀑布/贡献拆解）、kpi（指标卡）、scatter（散点）。图表放 reports/assets/，在报告中用 ![图注](assets/文件名.svg) 引用，并用 source 参数写明数据来源。若 write_chart 不可用，就手写独立 SVG（白底、无外部依赖、字号不小于 20、注明来源）。图表里的数据必须与正文一致，不得为了好看编造数据点或坐标。
                9. 用户提供本地文件时，先用 read_document 读取（支持 docx / xlsx / pptx / csv / tsv / txt / md / json；xlsx 会按工作表输出表格）。PDF 暂不支持直接解析——请用户把它转成 docx/txt，或只提供关键页的文字/数据。
                10. 报告交付前必须跑 report_lint 检查引用编号、来源清单和图片/图表路径；有错误就修正后重新检查。交付时用 present 给出报告；如果图表较多，可一并交付关键图表。

                边界：你只做检索、分析和写作，不执行命令、不修改用户的其他文件；除 reports/ 下新建的报告、笔记、图表和来源台账外，不改动工作区中的其他内容。如果用户要的是整理本地资料而不是联网检索，就先用 read_document 读取资料，再在其基础上整理，并在报告中说明来源是本地文件。
          - id: time-context
            name: "@deepseek-ai/dsh-time-context"
          - id: tool-research
            name: "dsh-agent-researcher"
            config:
              defaultDir: "reports/assets"
              sourcesFile: "reports/sources.json"
              searchMaxQueries: 6
          - id: tool-web
            name: "@deepseek-ai/dsh-tool-web"
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-fs-search
            name: "@deepseek-ai/dsh-tool-fs-search"
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: "@deepseek-ai/dsh-skill-filesystem"
          - id: tool-skill
            name: "@deepseek-ai/dsh-tool-skill"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: "@deepseek-ai/dsh-tool-ask-user"
          - id: present
            name: "@deepseek-ai/dsh-tool-present"
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: "@deepseek-ai/dsh-compaction-basic"
              - id: command-compact
                name: "@deepseek-ai/dsh-command-compact"
              - id: tool-result-pruner
                name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
