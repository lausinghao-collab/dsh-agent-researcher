name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate bundle manifest and required files
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!pkg.dsh || !pkg.dsh.bundle || !pkg.dsh.bundle.patch) {
              throw new Error('package.json 缺少 dsh.bundle.patch');
            }
            const required = [
              pkg.dsh.bundle.patch, 'lib/index.js', 'lib/charts.js', 'lib/sources.js',
              'lib/search.js', 'lib/documents.js', 'lib/zip.js', 'README.md', 'LICENSE',
            ];
            for (const file of required) {
              if (!fs.existsSync(file)) throw new Error('缺少文件: ' + file);
            }
            console.log('manifest ok');
          "

      - name: Run unit tests
        shell: bash
        run: >-
          node --test
          test/charts.test.mjs
          test/sources.test.mjs
          test/search.test.mjs
          test/documents.test.mjs

      - name: Validate patch YAML
        shell: bash
        run: |
          npx --yes js-yaml cordis.patch.yml > /dev/null
          echo "yaml ok"

      - name: Validate preset declaration
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const text = fs.readFileSync('cordis.patch.yml', 'utf8');
            if (!/id:\s*preset-researcher/.test(text)) throw new Error('缺少 preset-researcher 行');
            if (!/id:\s*researcher/.test(text)) throw new Error('缺少 researcher preset id');
            if (!/tool-research/.test(text)) throw new Error('缺少 tool-research 行');
            if (!/read_document/.test(text)) throw new Error('persona 未提到 read_document');
            console.log('preset ok');
          "
